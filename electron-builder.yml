appId: io.github.newtosh.calico
productName: Calico
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  # The main process loads these by path (the tray image, the window icon), so they ship
  # with the app. electron-vite's ?asset import points at resources/, not out/.
  - resources/icon.png
  - resources/tray.png
asarUnpack:
  - resources/**
artifactName: ${productName}-${version}-${arch}.${ext}
publish: null
linux:
  target: [AppImage, deb, pacman]
  category: Development
  executableName: calico
  syncDesktopName: true
  icon: resources/icon.png
  synopsis: "Desktop app for the ginger panel: shows what your coding agents are doing"
  description: Runs Calico's server, which the panel polls, shows agent status, and sets up the panel over USB or Bluetooth.
