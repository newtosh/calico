name: release
on:
  push:
    tags: ["app-v*"]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No dependency cache: this job can write releases and mint
          # attestations, so it must not restore anything a PR could poison.
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Tagged commit is on main
        # Only commits that went through a pull request and its checks can ship.
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag matches package.json
        run: test "$GITHUB_REF_NAME" = "app-v$(node -p 'require("./package.json").version')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm dist
      - run: cd dist && sha256sum *.AppImage *.deb *.pacman > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.pacman
      - run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag dist/*.AppImage dist/*.deb dist/*.pacman dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
