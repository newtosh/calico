name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a pnpm test:e2e
  # Packaged builds on stock Ubuntu 24.04, which restricts the user namespaces
  # Chromium's sandbox needs. No sysctl here: this is what users get.
  package:
    name: package (ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # libfuse2t64 lets the AppImage mount, so its step tests the sandbox alone.
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools libfuse2t64
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
      - run: sudo apt-get install -y ./dist/*.deb
      - name: tray and window icons ship
        # The main process loads these by path. They once shipped missing, so the installed
        # app had no tray icon even though dev builds did.
        run: |
          for f in tray.png icon.png; do
            test -s "/opt/Calico/resources/app.asar.unpacked/resources/$f"
          done
      - name: deb launches
        run: xvfb-run -a scripts/package-smoke.sh calico
      - name: AppImage launches
        run: |
          chmod +x dist/*.AppImage
          xvfb-run -a scripts/package-smoke.sh dist/*.AppImage
  # Firmware host tests and the Python reference implementation. Both are plain
  # gcc and pytest, so this stays fast. The ESP-IDF build is not run here yet.
  firmware:
    name: firmware and tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: firmware/host/run.sh
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install 'pytest>=8' 'pillow>=10'
      - name: Python reference companion
        run: cd tools/python-companion/companion && "$RUNNER_TEMP/venv/bin/python" -m pytest -q
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Provisioning scripts
        # test_wifi_join_and_glass_scan_use_psram_stacks greps main.c for a
        # task that moved, and fails the same way in the original repo.
        run: >-
          cd firmware/scripts && "$RUNNER_TEMP/venv/bin/python" -m pytest -q
          --deselect test_ble_provision.py::test_wifi_join_and_glass_scan_use_psram_stacks
  # The relay Worker, run in a local workerd. Its own lockfile: it is not part of the app.
  relay:
    name: relay worker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/relay/package-lock.json
      - run: npm ci --prefix tools/relay
      - run: npm test --prefix tools/relay
