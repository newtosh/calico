# Public BLE GATT UUIDs of the ginger desk service (formerly grokbot-buddy), not secrets.
# The "token" characteristic's UUID trips the generic-api-key rule.
[extend]
useDefault = true

[[allowlists]]
description = "ginger BLE service UUIDs"
regexes = ['''8d7c4b1[0-7]-6e2a-4f91-a3c5-67726f6b6465''']
