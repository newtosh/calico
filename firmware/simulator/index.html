<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Desk panel preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #efe7d6;
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      #panel {
        width: 480px;
        height: 480px;
        box-sizing: border-box;
        padding: 0;
        border-radius: 48px;
        overflow: hidden;
        background: #14160f;
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }
      #bar {
        width: 100%;
        height: 48px;
        box-sizing: border-box;
        padding: 16px 16px 0;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
        background: #0c0e09;
      }
      #lamp {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #e2a23a;
        flex: none;
      }
      #lamp.green {
        background: #9bb57a;
      }
      #lamp.red {
        background: #c4544a;
      }
      #brand,
      #toast {
        position: absolute;
        left: 50%;
        top: 0;
        width: 168px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 16px;
        line-height: 32px;
        color: #efe7d6;
        text-align: center;
        pointer-events: none;
        transform: translateX(-50%);
      }
      #toast {
        opacity: 0;
      }
      #toast.show {
        animation: toast 3.2s ease forwards;
      }
      #bar:has(#toast.show) #brand {
        visibility: hidden;
      }
      @keyframes toast {
        0% {
          opacity: 0;
          transform: translate(-50%, -10px);
        }
        8% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        82% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -6px);
        }
      }
      #glance {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      #wifi {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 14px;
      }
      #wifi i {
        width: 4px;
        display: block;
        background: #a39b88;
        opacity: 0.35;
      }
      #wifi i:nth-child(1) {
        height: 6px;
      }
      #wifi i:nth-child(2) {
        height: 10px;
      }
      #wifi i:nth-child(3) {
        height: 14px;
      }
      #wifi[data-bars="1"] i:nth-child(1),
      #wifi[data-bars="2"] i:nth-child(-n + 2),
      #wifi[data-bars="3"] i {
        background: #efe7d6;
        opacity: 1;
      }
      #bt {
        color: #a39b88;
        opacity: 0.45;
        font-size: 14px;
        line-height: 1;
        text-decoration: line-through;
      }
      #rotlock {
        height: 28px;
        min-width: 64px;
        font-size: 16px;
        padding: 0 8px;
      }
      #rotlock[aria-pressed="true"] {
        border-color: #9bb57a;
        background: #3d4f32;
      }
      #panel.needs #bar {
        visibility: hidden;
      }
      #face {
        flex: 1;
        min-height: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #title,
      #message {
        width: 100%;
        text-align: center;
      }
      #title {
        margin: 4px 0 0;
        min-height: 24px;
        font-size: 24px;
        line-height: 1;
      }
      #title:empty {
        visibility: hidden;
      }
      #message {
        margin: 4px 0 0;
        font-size: 20px;
        line-height: 1;
        color: #a39b88;
      }
      #agents {
        flex: 1;
        width: 100%;
        margin: 4px 0 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow: hidden;
        font-size: 24px;
        line-height: 1;
      }
      .agent {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        min-height: 34px;
      }
      .mark {
        width: 24px;
        height: 24px;
        flex: none;
        background: #a39b88;
      }
      .mark.circle {
        border-radius: 50%;
      }
      .mark.square {
        border-radius: 2px;
      }
      .mark.diamond {
        width: 18px;
        height: 18px;
        border-radius: 2px;
        transform: rotate(45deg);
      }
      .mark.triangle {
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
      }
      .agent span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #chrome {
        width: 100%;
        box-sizing: border-box;
        padding: 0 16px 16px;
        background: #0c0e09;
      }
      #panel.needs #chrome {
        background: transparent;
      }
      #dock {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #count {
        margin: 0;
        font-size: 28px;
        line-height: 1;
        color: #9bb57a;
      }
      #mic,
      #settings {
        width: 80px;
        height: 64px;
        flex: none;
        padding: 0;
        display: grid;
        place-items: center;
        color: #efe7d6;
      }
      #mic svg,
      #settings svg {
        width: 40px;
        height: 40px;
      }
      #mic {
        background: #24261f;
        border-color: rgba(109, 103, 86, 0.4);
        color: rgba(239, 231, 214, 0.5);
      }
      #count.idle {
        color: #a39b88;
      }
      #sleeper {
        display: none;
        align-items: flex-end;
        gap: 10px;
        margin-top: 36px;
        color: #a39b88;
        pointer-events: none;
      }
      #panel.asleep #sleeper {
        display: flex;
      }
      #sleeper .face {
        width: 96px;
        height: 96px;
        box-sizing: border-box;
        border: 3px solid #a39b88;
        border-radius: 50%;
        background: #a39b8833;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        animation: bob 4.4s ease-in-out infinite;
      }
      #sleeper .face i {
        width: 22px;
        height: 4px;
        border-radius: 2px;
        background: #a39b88;
      }
      #sleeper b {
        font-size: 24px;
        font-weight: 500;
        animation: zzz 4.2s linear infinite;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(10px);
        }
      }
      @keyframes zzz {
        0% {
          opacity: 0;
          transform: translateY(4px);
        }
        20% {
          opacity: 0.9;
          transform: translateY(4px);
        }
        80% {
          opacity: 0.9;
          transform: translateY(-12px);
        }
        100% {
          opacity: 0;
          transform: translateY(-12px);
        }
      }
      button {
        background: #2a2d24;
        color: #efe7d6;
        border: 1px solid #6d6756;
        border-radius: 6px;
        padding: 8px 14px;
        font: inherit;
      }
      #panel.needs {
        background: #e2a23a;
        color: #14160f;
      }
      #panel.needs #title,
      #panel.needs #message,
      #panel.needs #count {
        color: #14160f;
      }
      #panel.needs button {
        background: #14160f;
        color: #efe7d6;
        border-color: #14160f;
      }
    </style>
  </head>
  <body>
    <div id="panel" class="asleep">
      <div id="bar">
        <i id="lamp" class="amber"></i>
        <div id="brand">grokbot-buddy</div>
        <div id="toast"></div>
        <div id="glance">
          <span id="wifi" data-bars="0" title="Wi-Fi"><i></i><i></i><i></i></span>
          <span id="bt" title="Bluetooth off">BT</span>
          <button id="rotlock" type="button" aria-pressed="false">Auto</button>
        </div>
      </div>
      <div id="face">
      <p id="title"></p>
      <p id="message"></p>
      <div id="sleeper" aria-hidden="true">
        <div class="face"><i></i><i></i></div>
        <b>Zzz</b>
      </div>
      <div id="agents"></div>
      </div>
      <div id="chrome">
        <div id="dock">
          <button id="mic" type="button" aria-label="Mic">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
              <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
              <line x1="12" x2="12" y1="19" y2="22" />
            </svg>
          </button>
          <p id="count" class="idle">idle</p>
          <button id="settings" type="button" aria-label="Settings">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    <script>
      const base = new URLSearchParams(location.search).get("base") || "http://127.0.0.1:8787";
      const panel = document.getElementById("panel");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const count = document.getElementById("count");
      const agents = document.getElementById("agents");
      const lamp = document.getElementById("lamp");
      const toast = document.getElementById("toast");
      const wifi = document.getElementById("wifi");
      const rotlock = document.getElementById("rotlock");
      const neutral = "#a39b88";
      let failures = 0;
      let statusSeen = "IDLE";
      let face = "IDLE";

      function statusText(phaseLabel, fail) {
        if (phaseLabel === "NO NETWORK" || phaseLabel === "SCAN FAILED") return phaseLabel;
        if (fail >= 3 || phaseLabel === "link down") return "link down";
        if (fail > 0) return "reconnecting";
        return phaseLabel || "IDLE";
      }

      function showToast(text) {
        if (!text || text === statusSeen) return;
        statusSeen = text;
        toast.textContent = text;
        toast.classList.remove("show");
        void toast.offsetWidth;
        toast.classList.add("show");
      }

      toast.addEventListener("animationend", () => toast.classList.remove("show"));

      function paintLink(phaseLabel, fail) {
        const text = statusText(phaseLabel, fail);
        const down = text === "link down" || text === "NO NETWORK" || text === "SCAN FAILED";
        const degraded = !down && (fail > 0 || text === "reconnecting");
        lamp.className = down ? "red" : degraded ? "amber" : "green";
        wifi.dataset.bars = down ? "0" : degraded ? "1" : "3";
        showToast(text);
      }

      function markColor(value) {
        const match = /^#?([0-9a-fA-F]{6})$/.exec(String(value || "").trim());
        return match ? "#" + match[1] : neutral;
      }

      function markShape(value) {
        const key = String(value || "").trim().toLowerCase();
        if (key === "square" || key === "diamond" || key === "triangle" || key === "circle") {
          return key;
        }
        return "circle";
      }

      function faceTitle(event) {
        if (!event || !event.title || (event.title === "Dismissed" && !event.message)) return "";
        return event.title;
      }

      function label(status) {
        if (failures >= 3) return "link down";
        if (status.needs_you || status.phase === "needs_you") return "NEEDS YOU";
        if (status.phase === "running") return "RUNNING";
        return "IDLE";
      }

      async function tick() {
        try {
          const response = await fetch(base + "/api/status");
          if (!response.ok) throw new Error(String(response.status));
          const status = await response.json();
          failures = 0;
          face = label(status);
          paintLink(face, failures);
          title.textContent = faceTitle(status.last_event);
          message.textContent = (status.last_event && status.last_event.message) || "";
          const list = status.agents || [];
          const running = list.filter((agent) => agent.status === "running").length;
          const quiet = label(status) === "IDLE" && running === 0;
          count.textContent = running === 0 ? "idle" : running + "/" + list.length + " running";
          count.classList.toggle("idle", running === 0);
          panel.classList.toggle("asleep", quiet);
          agents.replaceChildren();
          (status.agents || []).slice(0, 6).forEach((agent) => {
            const row = document.createElement("div");
            const mark = document.createElement("i");
            const name = document.createElement("span");
            row.className = "agent";
            mark.className = "mark " + markShape(agent.shape);
            mark.style.background = markColor(agent.color);
            name.textContent = agent.title || agent.id || "agent";
            row.append(mark, name);
            agents.append(row);
          });
          panel.classList.toggle("needs", status.needs_you === true);
        } catch (err) {
          failures = Math.min(3, failures + 1);
          if (failures >= 3) face = "link down";
          paintLink(face, failures);
          if (failures >= 3) {
            panel.classList.remove("asleep");
          }
        }
      }

      rotlock.addEventListener("click", (event) => {
        const locked = rotlock.getAttribute("aria-pressed") !== "true";
        event.stopPropagation();
        rotlock.setAttribute("aria-pressed", locked ? "true" : "false");
        rotlock.textContent = locked ? "Lock" : "Auto";
      });
      document.getElementById("mic").addEventListener("click", () => {
        message.textContent = "Voice not in this PoC";
      });
      panel.addEventListener("click", (event) => {
        if (event.target.closest("button") || !panel.classList.contains("needs")) {
          return;
        }
        fetch(base + "/api/dismiss", { method: "POST" });
      });
      tick();
      setInterval(tick, 2000);
    </script>
  </body>
</html>
