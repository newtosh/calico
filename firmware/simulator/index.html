<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Desk panel preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #efe7d6;
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      #panel {
        width: 480px;
        height: 480px;
        box-sizing: border-box;
        padding: 16px;
        border-radius: 48px;
        background: #14160f;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #phase {
        margin-top: 0;
        font-size: 48px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-align: center;
        color: #a39b88;
      }
      #panel.running #phase {
        color: #9bb57a;
      }
      #title,
      #message,
      #count {
        width: 100%;
        text-align: center;
      }
      #title {
        margin: 4px 0 0;
        font-size: 24px;
        line-height: 1;
      }
      #message {
        margin: 4px 0 0;
        font-size: 20px;
        line-height: 1;
        color: #a39b88;
      }
      #agents {
        flex: 1;
        width: 100%;
        margin: 4px 0 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow: hidden;
        font-size: 24px;
        line-height: 1;
      }
      .agent {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        min-height: 34px;
      }
      .mark {
        width: 24px;
        height: 24px;
        flex: none;
        background: #a39b88;
      }
      .mark.circle {
        border-radius: 50%;
      }
      .mark.square {
        border-radius: 2px;
      }
      .mark.diamond {
        width: 18px;
        height: 18px;
        border-radius: 2px;
        transform: rotate(45deg);
      }
      .mark.triangle {
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
      }
      .agent span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #count {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1;
        color: #9bb57a;
      }
      #dock {
        width: 100%;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      #mic,
      #settings {
        height: 64px;
        font-size: 24px;
        line-height: 1;
        padding: 0 16px;
      }
      #mic {
        min-width: 148px;
      }
      #settings {
        min-width: 204px;
      }
      #sleeper {
        display: none;
        align-items: flex-end;
        gap: 10px;
        margin-top: 36px;
        color: #a39b88;
        pointer-events: none;
      }
      #panel.asleep #sleeper {
        display: flex;
      }
      #sleeper .face {
        width: 96px;
        height: 96px;
        box-sizing: border-box;
        border: 3px solid #a39b88;
        border-radius: 50%;
        background: #a39b8833;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        animation: bob 4.4s ease-in-out infinite;
      }
      #sleeper .face i {
        width: 22px;
        height: 4px;
        border-radius: 2px;
        background: #a39b88;
      }
      #sleeper b {
        font-size: 24px;
        font-weight: 500;
        animation: zzz 4.2s linear infinite;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(10px);
        }
      }
      @keyframes zzz {
        0% {
          opacity: 0;
          transform: translateY(4px);
        }
        20% {
          opacity: 0.9;
          transform: translateY(4px);
        }
        80% {
          opacity: 0.9;
          transform: translateY(-12px);
        }
        100% {
          opacity: 0;
          transform: translateY(-12px);
        }
      }
      button {
        background: #2a2d24;
        color: #efe7d6;
        border: 1px solid #6d6756;
        border-radius: 6px;
        padding: 8px 14px;
        font: inherit;
      }
      #panel.needs {
        background: #e2a23a;
        color: #14160f;
      }
      #panel.needs #phase,
      #panel.needs #title,
      #panel.needs #message,
      #panel.needs #count {
        color: #14160f;
      }
      #panel.needs button {
        background: #14160f;
        color: #efe7d6;
        border-color: #14160f;
      }
    </style>
  </head>
  <body>
    <div id="panel" class="asleep">
      <div id="phase">IDLE</div>
      <p id="title">Waiting</p>
      <p id="message"></p>
      <div id="sleeper" aria-hidden="true">
        <div class="face"><i></i><i></i></div>
        <b>Zzz</b>
      </div>
      <div id="agents"></div>
      <p id="count">0 running</p>
      <div id="dock">
        <button id="mic" type="button">Mic</button>
        <button id="settings" type="button">Settings</button>
      </div>
    </div>
    <script>
      const base = new URLSearchParams(location.search).get("base") || "http://127.0.0.1:8787";
      const panel = document.getElementById("panel");
      const phase = document.getElementById("phase");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const count = document.getElementById("count");
      const agents = document.getElementById("agents");
      const neutral = "#a39b88";
      let failures = 0;

      function markColor(value) {
        const match = /^#?([0-9a-fA-F]{6})$/.exec(String(value || "").trim());
        return match ? "#" + match[1] : neutral;
      }

      function markShape(value) {
        const key = String(value || "").trim().toLowerCase();
        if (key === "square" || key === "diamond" || key === "triangle" || key === "circle") {
          return key;
        }
        return "circle";
      }

      function label(status) {
        if (failures >= 3) return "link down";
        if (status.needs_you || status.phase === "needs_you") return "NEEDS YOU";
        if (status.phase === "running") return "RUNNING";
        return "IDLE";
      }

      async function tick() {
        try {
          const response = await fetch(base + "/api/status");
          if (!response.ok) throw new Error(String(response.status));
          const status = await response.json();
          failures = 0;
          phase.textContent = label(status);
          title.textContent = (status.last_event && (status.last_event.title || status.last_event.message)) || "Waiting";
          message.textContent = (status.last_event && status.last_event.message) || "";
          const running = (status.agents || []).filter((agent) => agent.status === "running").length;
          const quiet = label(status) === "IDLE" && running === 0;
          count.textContent = running + " running";
          panel.classList.toggle("asleep", quiet);
          agents.replaceChildren();
          (status.agents || []).slice(0, 6).forEach((agent) => {
            const row = document.createElement("div");
            const mark = document.createElement("i");
            const name = document.createElement("span");
            row.className = "agent";
            mark.className = "mark " + markShape(agent.shape);
            mark.style.background = markColor(agent.color);
            name.textContent = agent.title || agent.id || "agent";
            row.append(mark, name);
            agents.append(row);
          });
          panel.classList.toggle("needs", status.needs_you === true);
          panel.classList.toggle(
            "running",
            status.needs_you !== true && status.phase === "running",
          );
        } catch (err) {
          failures = Math.min(3, failures + 1);
          phase.textContent = failures >= 3 ? "link down" : phase.textContent;
          if (failures >= 3) {
            panel.classList.remove("asleep");
          }
        }
      }

      document.getElementById("mic").addEventListener("click", () => {
        message.textContent = "Voice not in this PoC";
      });
      panel.addEventListener("click", (event) => {
        if (event.target.closest("button") || !panel.classList.contains("needs")) {
          return;
        }
        fetch(base + "/api/dismiss", { method: "POST" });
      });
      tick();
      setInterval(tick, 2000);
    </script>
  </body>
</html>
