<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Desk panel preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #efe7d6;
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      #panel {
        position: relative;
        width: 480px;
        height: 480px;
        box-sizing: border-box;
        padding: 0;
        border-radius: 48px;
        overflow: hidden;
        background: #14160f;
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }
      #bar {
        width: 100%;
        height: 48px;
        box-sizing: border-box;
        padding: 16px 16px 0;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
        z-index: 7;
        background: #0c0e09;
      }
      #lamp {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #e2a23a;
        flex: none;
      }
      #lamp.green {
        background: #9bb57a;
      }
      #lamp.red {
        background: #c4544a;
      }
      #brand,
      #toast {
        position: absolute;
        left: 50%;
        top: 0;
        width: 168px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 16px;
        line-height: 32px;
        color: #efe7d6;
        text-align: center;
        pointer-events: none;
        transform: translateX(-50%);
      }
      #toast {
        opacity: 0;
      }
      #toast.show {
        animation: toast 3.2s ease forwards;
      }
      #bar:has(#toast.show) #brand {
        visibility: hidden;
      }
      @keyframes toast {
        0% {
          opacity: 0;
          transform: translate(-50%, -10px);
        }
        8% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        82% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -6px);
        }
      }
      #glance {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      #wifi {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 14px;
      }
      #wifi i {
        width: 4px;
        display: block;
        background: #a39b88;
        opacity: 0.35;
      }
      #wifi i:nth-child(1) {
        height: 6px;
      }
      #wifi i:nth-child(2) {
        height: 10px;
      }
      #wifi i:nth-child(3) {
        height: 14px;
      }
      #wifi[data-bars="1"] i:nth-child(1),
      #wifi[data-bars="2"] i:nth-child(-n + 2),
      #wifi[data-bars="3"] i {
        background: #efe7d6;
        opacity: 1;
      }
      #bt {
        width: 20px;
        height: 14px;
        color: #efe7d6;
      }
      #bt svg {
        display: block;
      }
      #bt[data-state="off"] {
        color: #a39b88;
        opacity: 0.4;
      }
      #bt[data-state="off"] .dot {
        display: none;
      }
      #bt[data-state="adv"] {
        color: #efe7d6;
        opacity: 1;
      }
      #bt[data-state="conn"] {
        color: #9bb57a;
        opacity: 1;
      }
      #rot {
        width: 24px;
        height: 24px;
        color: #efe7d6;
      }
      #rot svg {
        display: block;
      }
      #rot[data-state="auto"] .lock {
        display: none;
      }
      #rot[data-state="lock"] .ring {
        display: none;
      }
      #rot[data-state="lock"] {
        color: #9bb57a;
      }
      #cc-scrim {
        position: absolute;
        inset: 0;
        z-index: 5;
        background: rgba(0, 0, 0, 0.47);
      }
      #cc-scrim[hidden] {
        display: none;
      }
      #cc {
        position: absolute;
        z-index: 6;
        left: 24px;
        top: 48px;
        box-sizing: border-box;
        width: 432px;
        height: 432px;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 12px;
        padding: 16px;
        overflow: hidden;
        border: 3px solid #6d6756;
        border-radius: 28px;
        outline: 2px solid rgba(109, 103, 86, 0.16);
        outline-offset: 1px;
        background: rgba(12, 14, 9, 0.98);
        touch-action: none;
      }
      #cc button[data-tile="rot"] {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #cc button[data-tile="rot"] svg {
        display: block;
        width: 24px;
        height: 24px;
      }
      #cc button[data-tile="rot"] .ring {
        color: #efe7d6;
      }
      #cc button[data-tile="rot"] .lock {
        color: #9bb57a;
      }
      #cc button[data-tile="rot"][aria-pressed="false"] .lock,
      #cc button[data-tile="rot"][aria-pressed="true"] .ring {
        display: none;
      }
      #cc[hidden] {
        display: none;
      }
      #cc button {
        box-sizing: border-box;
        width: 191px;
        height: 72px;
        margin: 0;
        padding: 4px;
        border-width: 2px;
        border-radius: 16px;
        background: #2a2d24;
        font-size: 16px;
        line-height: 1.1;
      }
      #cc button[aria-pressed="true"] {
        background: #3d4f32;
        border-color: #9bb57a;
      }
      #cc button b,
      #cc button small {
        display: block;
        font-weight: 400;
      }
      #cc button small {
        color: #a39b88;
      }
      #face {
        flex: 1;
        min-height: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #title,
      #message {
        width: 100%;
        text-align: center;
      }
      #title {
        margin: 4px 0 0;
        min-height: 24px;
        font-size: 24px;
        line-height: 1;
      }
      #title:empty {
        visibility: hidden;
      }
      #message {
        margin: 4px 0 0;
        font-size: 20px;
        line-height: 1;
        color: #a39b88;
      }
      #message:empty {
        display: none;
      }
      #agents {
        flex: 1;
        min-height: 0;
        width: 100%;
        margin: 2px 0 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        font-size: 24px;
        line-height: 1;
        user-select: none;
      }
      .agent {
        display: flex;
        align-items: center;
        gap: 12px;
        box-sizing: border-box;
        min-width: 0;
        min-height: 30px;
        padding: 0 8px;
        border-radius: 8px;
      }
      .agent.hot {
        background: #527044;
        box-shadow: inset 2px 0 0 #9bb57a;
      }
      .agent.hot .aside {
        color: #d4ccba;
      }
      .agent .name {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: clip;
      }
      .agent .aside {
        flex: 1 1 auto;
        width: auto;
        max-width: none;
        min-width: 48px;
        height: 24px;
        overflow: hidden;
        font-size: 20px;
        line-height: 24px;
        text-align: left;
        color: #a39b88;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .agent .aside.marquee {
        text-align: left;
        text-overflow: clip;
      }
      .agent .aside .track {
        display: inline-block;
        height: 24px;
        overflow: visible;
        text-overflow: clip;
        white-space: nowrap;
      }
      @keyframes aside-marquee {
        0%,
        12% {
          transform: translateX(0);
        }
        88%,
        100% {
          transform: translateX(var(--shift));
        }
      }
      .mark {
        position: relative;
        width: 24px;
        height: 24px;
        flex: none;
        overflow: hidden;
        background: #a39b88;
        /* Neutral #a39b88 divided by 6. JS replaces this per color. */
        --eye: #1b1916;
        --el: 25%;
        --er: 62.5%;
        --ey: 29.1667%;
        --ew: 12.5%;
        --eh: 16.6667%;
      }
      .mark::before,
      .mark::after {
        content: "";
        position: absolute;
        top: var(--ey);
        width: var(--ew);
        height: var(--eh);
        border-radius: 999px;
        background: var(--eye);
        pointer-events: none;
      }
      .mark::before {
        left: var(--el);
      }
      .mark::after {
        left: var(--er);
      }
      .mark.circle {
        border-radius: 50%;
      }
      .mark.square {
        border-radius: 2px;
      }
      .mark.diamond {
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
        --ey: 33.3333%;
      }
      .mark.triangle {
        clip-path: polygon(50% 4.1667%, 91.6667% 83.3333%, 83.3333% 95.8333%, 16.6667% 95.8333%, 8.3333% 83.3333%);
        --el: 33.3333%;
        --er: 54.1667%;
        --ey: 50%;
        --ew: 12.5%;
        --eh: 12.5%;
      }
      .mark.rounded {
        border-radius: 6px;
      }
      .mark.oval {
        clip-path: inset(12.5% 4.1667% 12.5% 4.1667% round 50%);
        --ey: 33.3333%;
      }
      .mark.pill {
        clip-path: inset(25% 4.1667% 20.8333% 4.1667% round 50%);
        --ey: 37.5%;
        --eh: 12.5%;
      }
      .mark.hex {
        --ey: 37.5%;
      }
      .mark.cloud {
        --ey: 41.6667%;
      }
      .mark.drop {
        --el: 29.1667%;
        --er: 58.3333%;
        --ey: 54.1667%;
      }
      .mark.star {
        --el: 33.3333%;
        --er: 58.3333%;
        --ey: 45.8333%;
        --ew: 8.3333%;
        --eh: 12.5%;
      }
      .mark.flower {
        --el: 20.8333%;
        --er: 66.6667%;
        --ey: 20.8333%;
        --eh: 12.5%;
      }
      .mark.heart {
        --el: 20.8333%;
        --er: 66.6667%;
        --ey: 25%;
        --eh: 12.5%;
      }
      .mark.blob,
      .mark.pentagon,
      .mark.sun {
        --el: 29.1667%;
        --er: 58.3333%;
        --ey: 37.5%;
        --eh: 12.5%;
      }
      .mark.pentagon {
        --ey: 41.6667%;
      }
      .mark.cloud {
        clip-path: url(#mark-cloud);
      }
      .mark.flower {
        clip-path: url(#mark-flower);
      }
      .mark.heart {
        clip-path: url(#mark-heart);
      }
      .mark.drop {
        clip-path: url(#mark-drop);
      }
      .mark.star {
        clip-path: url(#mark-star);
      }
      .mark.blob {
        clip-path: url(#mark-blob);
      }
      .mark.pentagon {
        clip-path: url(#mark-pentagon);
      }
      .mark.sun {
        clip-path: url(#mark-sun);
      }
      .mark.hex {
        clip-path: url(#mark-hex);
      }
      .agent span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #chrome {
        width: 100%;
        box-sizing: border-box;
        padding: 16px 24px 24px;
        background: #0c0e09;
      }
      #dock {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #count {
        margin: 0;
        font-size: 28px;
        line-height: 1;
        color: #9bb57a;
      }
      #mic,
      #settings {
        width: 72px;
        height: 58px;
        flex: none;
        padding: 0;
        display: grid;
        place-items: center;
        color: #efe7d6;
      }
      #mic svg,
      #settings svg {
        width: 40px;
        height: 40px;
      }
      #mic {
        background: #24261f;
        border-color: rgba(109, 103, 86, 0.4);
        color: rgba(239, 231, 214, 0.5);
      }
      #count.idle {
        color: #a39b88;
      }
      #newjump {
        position: absolute;
        top: 86px;
        left: 50%;
        z-index: 3;
        height: 32px;
        padding: 0 14px;
        transform: translateX(-50%);
        border: 1px solid #9bb57a;
        border-radius: 999px;
        background: #527044;
        color: #efe7d6;
        font-size: 16px;
      }
      #sleeper {
        display: none;
        align-items: flex-end;
        gap: 10px;
        margin-top: 36px;
        color: #a39b88;
        pointer-events: none;
      }
      #panel.asleep #sleeper {
        display: flex;
      }
      #sleeper .face {
        width: 96px;
        height: 96px;
        box-sizing: border-box;
        border: 3px solid #a39b88;
        border-radius: 50%;
        background: #a39b8833;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        animation: bob 4.4s ease-in-out infinite;
      }
      #sleeper .face i {
        width: 22px;
        height: 4px;
        border-radius: 2px;
        background: #a39b88;
      }
      #sleeper b {
        font-size: 24px;
        font-weight: 500;
        animation: zzz 4.2s linear infinite;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(10px);
        }
      }
      @keyframes zzz {
        0% {
          opacity: 0;
          transform: translateY(4px);
        }
        20% {
          opacity: 0.9;
          transform: translateY(4px);
        }
        80% {
          opacity: 0.9;
          transform: translateY(-12px);
        }
        100% {
          opacity: 0;
          transform: translateY(-12px);
        }
      }
      button {
        background: #2a2d24;
        color: #efe7d6;
        border: 1px solid #6d6756;
        border-radius: 6px;
        padding: 8px 14px;
        font: inherit;
      }
      #settings-screen {
        position: absolute;
        inset: 0;
        z-index: 8;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 24px;
        background: #0c0e09;
        color: #efe7d6;
        font-family: Montserrat, ui-sans-serif, system-ui, sans-serif;
      }
      #settings-screen[hidden] {
        display: none;
      }
      #settings-screen button {
        box-sizing: border-box;
        padding: 0 12px;
      }
      #settings-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 56px;
        flex: none;
        padding: 0 3px;
      }
      #settings-head h2 {
        margin: 0;
        font-size: 28px;
        font-weight: 400;
        line-height: 1;
      }
      #settings-done {
        width: 104px;
        height: 48px;
        border-radius: 999px;
        background: #3a3d32;
        border: 1px solid #6d6756;
        font-size: 20px;
      }
      #settings-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0 3px;
      }
      #settings-screen .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      #settings-status {
        margin: 0;
        min-width: 0;
        font-size: 16px;
        line-height: 1.2;
        color: #a39b88;
        text-align: right;
      }
      #settings-selected {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
        color: #efe7d6;
      }
      #settings-screen h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 400;
        color: #a39b88;
      }
      #settings-screen .card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        background: #14160f;
        border: 3px solid #6d6756;
        border-radius: 16px;
        outline: 2px solid rgba(109, 103, 86, 0.16);
        outline-offset: 1px;
      }
      #settings-screen .nets {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
        height: 102px;
        overflow: auto;
      }
      #settings-screen .nets button {
        width: 100%;
        height: 48px;
        padding: 0 12px;
        text-align: left;
        font-size: 20px;
        border-radius: 12px;
        background: #2a2d24;
        border: 2px solid transparent;
      }
      #settings-screen .nets button.on {
        background: #3d4f32;
        border-color: #9bb57a;
      }
      #settings-screen label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 16px;
        color: #a39b88;
      }
      #settings-screen input {
        height: 48px;
        box-sizing: border-box;
        padding: 8px 12px;
        border-radius: 12px;
        border: 1px solid #6d6756;
        background: #2a2d24;
        color: #efe7d6;
        font-size: 20px;
      }
      #settings-screen .pair {
        display: flex;
        gap: 8px;
      }
      #settings-screen .pair button {
        flex: 1;
        height: 48px;
        font-size: 20px;
        border-radius: 12px;
        background: #3a3d32;
        border: 1px solid #6d6756;
      }
      #settings-save {
        height: 48px;
        flex: none;
        border-radius: 999px;
        background: #527044;
        border: 3px solid #9bb57a;
        color: #efe7d6;
        font-size: 20px;
      }
      #ssid-row[hidden] {
        display: none;
      }
      .peek {
        position: absolute;
        z-index: 3;
        height: 50px;
        box-sizing: border-box;
        border-radius: 28px 28px 0 0;
        background: rgba(22, 24, 15, 0.95);
        border: 2px solid #a39b88;
        pointer-events: none;
        transform: translateY(110%);
        transition: transform 280ms ease-out;
      }
      .peek.show {
        transform: translateY(0);
      }
      #peek1 {
        left: 42px;
        right: 42px;
        top: 48px;
      }
      #peek2 {
        left: 54px;
        right: 54px;
        top: 48px;
      }
      /* Outer glow. The box is 6px outside the card and ends on the 24px case line.
         Three 2px borders, faintest on the outside. Same weight on every side. */
      #sheet-glow {
        position: absolute;
        left: 24px;
        right: 24px;
        top: 42px;
        bottom: 24px;
        z-index: 2;
        pointer-events: none;
        transform: translateY(110%);
        transition: transform 280ms ease-out, top 280ms ease-out;
      }
      #sheet-glow.stack1 {
        top: 56px;
      }
      #sheet-glow.stack2 {
        top: 70px;
      }
      #sheet-glow.up {
        transform: translateY(0);
      }
      #sheet-glow i {
        position: absolute;
        box-sizing: border-box;
        background: transparent;
        border: 2px solid transparent;
        pointer-events: none;
      }
      #sheet-glow .far {
        inset: 0;
        border-radius: 42px;
      }
      #sheet-glow .mid {
        inset: 2px;
        border-radius: 40px;
      }
      #sheet-glow .near {
        inset: 4px;
        border-radius: 38px;
      }
      #sheet-inner-far,
      #sheet-inner-near {
        position: absolute;
        box-sizing: border-box;
        background: transparent;
        border-style: solid;
        pointer-events: none;
      }
      #sheet-inner-near {
        inset: 0;
        border-width: 3px;
        border-radius: 33px;
      }
      #sheet-inner-far {
        inset: 3px;
        border-width: 7px;
        border-radius: 30px;
      }
      #sheet {
        position: absolute;
        left: 30px;
        right: 30px;
        top: 48px;
        bottom: 30px;
        z-index: 4;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 8px 20px 12px;
        border-radius: 36px;
        background: rgba(12, 14, 9, 0.98);
        color: #efe7d6;
        border: 3px solid #a39b88;
        transform: translateY(110%);
        transition: transform 280ms ease-out, top 280ms ease-out;
        pointer-events: none;
      }
      #sheet.stack1 {
        top: 62px;
      }
      #sheet.stack2 {
        top: 76px;
      }
      #sheet.up {
        transform: translateY(0);
        pointer-events: auto;
      }
      #sheet .mark {
        position: relative;
        z-index: 1;
        width: 120px;
        height: 120px;
        flex: none;
      }
      #sheet .mark.square {
        border-radius: 10px;
      }
      #sheet .mark.rounded {
        border-radius: 30px;
      }
      #sheet-new {
        margin: 0;
        padding: 4px 14px;
        border-radius: 999px;
        border: 1px solid #a39b88;
        background: #2a2d24;
        color: #efe7d6;
        font-size: 20px;
        line-height: 24px;
      }
      #sheet h2 {
        margin: 0;
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 48px;
        font-weight: 400;
        line-height: 1.05;
        text-align: center;
      }
      #sheet .copy {
        flex: 1;
        min-height: 0;
        width: 100%;
        overflow: auto;
        font-size: 28px;
        line-height: 1.25;
        text-align: center;
      }
      #sheet-all {
        flex: none;
        width: 100%;
        height: 44px;
        background: transparent;
        color: #efe7d6;
        border: 1px solid #6d6756;
        border-radius: 999px;
        font-size: 20px;
      }
      #title.badge {
        align-self: center;
        width: fit-content;
        min-height: 24px;
        margin: 4px auto 0;
        padding: 0 10px;
        border: 1px solid #e2a23a;
        border-radius: 999px;
        background: #2a2d24;

    <script>
      const base = new URLSearchParams(location.search).get("base") || "http://127.0.0.1:8787";
      const panel = document.getElementById("panel");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const count = document.getElementById("count");
      const agents = document.getElementById("agents");
      const lamp = document.getElementById("lamp");
      const toast = document.getElementById("toast");
      const wifi = document.getElementById("wifi");
      const rot = document.getElementById("rot");
      const ccScrim = document.getElementById("cc-scrim");
      const ccSheet = document.getElementById("cc");
      let staOn = true;
      const neutral = "#a39b88";
      let failures = 0;
      let statusSeen = "IDLE";
      let face = "IDLE";
      let drag = null;
      let marquee = { id: "", text: "", until: 0, ready: false };

      agents.addEventListener("pointerdown", (event) => {
        if (event.pointerType !== "mouse" || event.button !== 0) return;
        drag = { id: event.pointerId, y: event.clientY, top: agents.scrollTop };
        agents.setPointerCapture(event.pointerId);
      });
      agents.addEventListener("pointermove", (event) => {
        if (!drag || drag.id !== event.pointerId) return;
        agents.scrollTop = drag.top - (event.clientY - drag.y);
      });
      function endDrag(event) {
        if (!drag || drag.id !== event.pointerId) return;
        drag = null;
      }
      agents.addEventListener("pointerup", endDrag);
      agents.addEventListener("pointercancel", endDrag);

      const newjump = document.getElementById("newjump");
      let prevStatus = null;
      let unseen = 0;
      let settling = false;

      function countUpdates(prev, next) {
        const prevList = (prev && prev.agents) || [];
        const nextList = (next && next.agents) || [];
        let n = 0;
        nextList.forEach((agent) => {
          const key = agent.id || agent.title || "";
          const old = key ? prevList.find((row) => (row.id || row.title || "") === key) : null;
          if (!old) {
            n += 1;
            return;
          }
          if (
            (agent.status || "") !== (old.status || "") ||
            !!agent.attention !== !!old.attention ||
            rowAside(agent, next) !== rowAside(old, prev)
          ) {
            n += 1;
          }
        });
        return n;
      }

      function paintNew() {
        const away =
          agents.scrollTop > 0 &&
          !panel.classList.contains("asleep") &&
          !document.getElementById("sheet").classList.contains("up");
        newjump.hidden = !away || unseen < 1;
        if (newjump.hidden) return;
        newjump.textContent = unseen > 99 ? "99+ new" : unseen + " new";
        newjump.style.top = message.textContent ? "98px" : "86px";
      }

      agents.addEventListener("scroll", () => {
        if (settling) return;
        if (agents.scrollTop <= 0) unseen = 0;
        paintNew();
      });
      newjump.addEventListener("click", (event) => {
        event.stopPropagation();
        unseen = 0;
        agents.scrollTop = 0;
        paintNew();
      });

      function statusText(phaseLabel, fail) {
        if (phaseLabel === "NO NETWORK" || phaseLabel === "SCAN FAILED") return phaseLabel;
        if (fail >= 3 || phaseLabel === "link down") return "link down";
        if (fail > 0) return "reconnecting";
        return phaseLabel || "IDLE";
      }

      function showToast(text) {
        if (!text || text === statusSeen) return;
        statusSeen = text;
        toast.textContent = text;
        toast.classList.remove("show");
        void toast.offsetWidth;
        toast.classList.add("show");
      }

      toast.addEventListener("animationend", () => toast.classList.remove("show"));

      function paintLink(phaseLabel, fail) {
        const text = statusText(phaseLabel, fail);
        const down = text === "link down" || text === "NO NETWORK" || text === "SCAN FAILED";
        const degraded = !down && (fail > 0 || text === "reconnecting");
        lamp.className = down ? "red" : degraded ? "amber" : "green";
        wifi.dataset.bars = !staOn || down ? "0" : degraded ? "1" : "3";
        showToast(text);
      }

      function markColor(value) {
        const match = /^#?([0-9a-fA-F]{6})$/.exec(String(value || "").trim());
        return match ? "#" + match[1] : neutral;
      }

      const markShapes = {
        square: "square",
        diamond: "diamond",
        triangle: "triangle",
        cloud: "cloud",
        rounded: "rounded",
        rounded_square: "rounded",
        squircle: "rounded",
        oval: "oval",
        pebble: "oval",
        ellipse: "oval",
        droplet: "drop",
        star: "star",
        flower: "flower",
        clover: "flower",
        heart: "heart",
        blob: "blob",
        splatter: "blob",
        drop: "drop",
        teardrop: "drop",
        pill: "pill",
        capsule: "pill",
        pentagon: "pentagon",
        shield: "pentagon",
        sun: "sun",
        gear: "sun",
        hex: "hex",
        hexagon: "hex",
      };

      function markShape(value) {
        const key = String(value || "").trim().toLowerCase();
        return markShapes[key] || "circle";
      }

      function eyeInk(hex) {
        const n = parseInt(String(hex).slice(1), 16);
        const part = (v) => Math.floor(v / 6).toString(16).padStart(2, "0");
        let r;
        let g;
        let b;
        let luma;
        if (!Number.isFinite(n)) return "#1b1916";
        r = (n >> 16) & 255;
        g = (n >> 8) & 255;
        b = n & 255;
        luma = (r * 3 + g * 6 + b) / 10;
        if (luma < 80) return "#efe7d6";
        return "#" + part(r) + part(g) + part(b);
      }

      function paintMark(mark, shape, color) {
        mark.className = "mark " + markShape(shape);
        mark.style.background = color;
        mark.style.setProperty("--eye", eyeInk(color));
      }

      function unreadText(status) {
        const count = Number(status && status.unread);
        if (!Number.isFinite(count) || count < 1) return "";
        return count > 99 ? "99+ unread" : Math.floor(count) + " unread";
      }

      function faceTitle(event) {
        if (!event || !event.title || (event.title === "Dismissed" && !event.message)) return "";
        return event.title;
      }

      function agentNeeds(agent) {
        return !!(agent && (agent.attention === true || agent.status === "needs_you"));
      }

      function rowAside(agent, status) {
        if (agent && agent.message) return agent.message;
        const note = (status.last_event && status.last_event.message) || "";
        const title = faceTitle(status.last_event);
        const eventAgent = (status.last_event && status.last_event.agent_id) || "";
        if (!note) return "";
        if (eventAgent && agent.id === eventAgent) return note;
        if (title && (agent.title === title || agent.id === title)) return note;
        if (!title && agentNeeds(agent)) return note;
        const list = status.agents || [];
        const waiters = list.filter(agentNeeds);
        const titled = title && list.some((row) => row.title === title || row.id === title);
        return agentNeeds(agent) && waiters.length === 1 && !titled ? note : "";
      }

      function syncMarquee(agent, aside, hot) {
        const id = agent ? agent.id || "" : "";
        const text = aside || "";
        if (!marquee.ready) {
          marquee = { id, text, until: hot && text ? Date.now() + 20000 : 0, ready: true };
          return;
        }
        const same = marquee.id === id && marquee.text === text;
        if (marquee.until > Date.now() && same) return;
        marquee = {
          id,
          text,
          until: hot && text && !same ? Date.now() + 20000 : 0,
          ready: true,
        };
      }

      function asideNode(text, scroll) {
        const aside = document.createElement("span");
        aside.className = "aside" + (scroll ? " marquee" : "");
        if (!scroll) {
          aside.textContent = text;
          return aside;
        }
        const track = document.createElement("span");
        const started = marquee.until - 20000;
        track.className = "track";
        track.textContent = text;
        aside.append(track);
        requestAnimationFrame(() => {
          const shift = Math.min(0, aside.clientWidth - track.scrollWidth);
          track.style.setProperty("--shift", shift + "px");
          track.style.animation = "aside-marquee 8s linear infinite";
          track.style.animationDelay = "-" + Math.max(0, Date.now() - started) + "ms";
        });
        return aside;
      }

      function label(status) {
        if (failures >= 3) return "link down";
        const waiting = (status.agents || []).some(agentNeeds);
        if (status.needs_you || status.phase === "needs_you" || waiting) return "NEEDS YOU";
        if (status.phase === "running") return "RUNNING";
        return "IDLE";
      }

      let pollMs = 2000;

      async function tick() {
        try {
          const response = await fetch(base + "/api/status");
          if (!response.ok) throw new Error(String(response.status));
          const status = await response.json();
          failures = 0;
          face = label(status);
          paintLink(face, failures);
          const badge = unreadText(status);
          title.textContent = badge;
          title.classList.toggle("badge", badge !== "");
          const note = (status.last_event && status.last_event.message) || "";
          const list = status.agents || [];
          const running = list.filter((agent) => agent.status === "running").length;
          const quiet = label(status) === "IDLE" && running === 0;
          pollMs = quiet ? 10000 : 2000;
          count.textContent = running === 0 ? "idle" : running + "/" + list.length + " running";
          count.classList.toggle("idle", running === 0);
          panel.classList.toggle("asleep", quiet && list.length === 0);
          const top = list[0];
          const topAside = top ? rowAside(top, status) : "";
          const keep = agents.scrollTop;
          const added = keep > 0 && prevStatus ? countUpdates(prevStatus, status) : 0;
          syncMarquee(top, topAside, !!(top && (agentNeeds(top) || topAside)));
          settling = true;
          agents.replaceChildren();
          let placed = false;
          list.forEach((agent, index) => {
            const row = document.createElement("div");
            const mark = document.createElement("i");
            const name = document.createElement("span");
            const asideText = rowAside(agent, status);
            const scrolling =
              index === 0 && marquee.until > Date.now() && marquee.text === asideText;
            row.className = "agent" + (agentNeeds(agent) || asideText ? " hot" : "");
            paintMark(mark, agent.shape, markColor(agent.color));
            name.className = "name";
            name.textContent = agent.title || agent.id || "agent";
            row.append(mark, name);
            if (asideText) {
              row.append(asideNode(asideText, scrolling));
              placed = true;
            }
            agents.append(row);
          });
          message.textContent = placed ? "" : note;
          agents.scrollTop = keep;
          settling = false;
          unseen = agents.scrollTop > 0 ? unseen + added : 0;
          prevStatus = status;
          paintSheet(status);
          paintNew();
        } catch (err) {
          failures = Math.min(3, failures + 1);
          pollMs = 2000;
          if (failures >= 3) face = "link down";
          paintLink(face, failures);
          if (failures >= 3) {
            panel.classList.remove("asleep");
          }
        }
      }

      /* Matches firmware/main/control_center.h. */
      const CC_GRAB = 48;
      const CC_OPEN_DY = 64;
      const CC_FLICK_DY = 28;
      const CC_FLICK_MS = 320;
      const CC_SLOP = 10;
      const CC_SCREEN = 480;
      const CC_OPEN_Y = 48;
      const CC_PANEL_H = CC_SCREEN - CC_OPEN_Y;
      let ccOpen = false;
      let ccReveal = 0;
      let ccDrag = null;
      let ccAte = false;
      function ccPlace(reveal) {
        ccReveal = Math.max(0, Math.min(CC_PANEL_H, reveal));
        ccSheet.style.top = CC_OPEN_Y + "px";
        ccSheet.style.height = ccReveal + "px";
        ccScrim.style.opacity = String(ccReveal / CC_PANEL_H);
        const show = ccReveal > 0;
        ccSheet.hidden = !show;
        ccScrim.hidden = !show;
      }
      function ccSnap(open) {
        ccOpen = open;
        ccSheet.style.transition = "height 220ms ease-out";
        ccReveal = open ? CC_PANEL_H : 0;
        ccSheet.hidden = false;
        ccScrim.hidden = false;
        ccSheet.style.top = CC_OPEN_Y + "px";
        ccSheet.style.height = ccReveal + "px";
        ccScrim.style.opacity = String(ccReveal / CC_PANEL_H);
        window.setTimeout(() => {
          ccSheet.style.transition = "";
          if (!ccOpen) {
            ccSheet.hidden = true;
            ccScrim.hidden = true;
          }
        }, 230);
      }
      function paintRot(locked) {
        rot.dataset.state = locked ? "lock" : "auto";
        rot.title = locked ? "Rotation locked" : "Rotation on";
        const tile = ccSheet.querySelector('[data-tile="rot"]');
        tile.setAttribute("aria-pressed", locked ? "true" : "false");
        tile.querySelector("small").textContent = locked ? "Lock" : "Auto";
      }
      function ccPointerDown(event, kind) {
        if (!settingsScreen.hidden) return;
        if (event.button != null && event.button !== 0) return;
        ccAte = false;
        ccDrag = {
          kind: kind,
          y: event.clientY,
          t: Date.now(),
          base: ccReveal,
          moved: false,
        };
        ccSheet.style.transition = "";
      }
      function ccPointerMove(event) {
        if (!ccDrag) return;
        const dy = event.clientY - ccDrag.y;
        if (Math.abs(dy) >= CC_SLOP) ccDrag.moved = true;
        if (ccDrag.kind === "grab" && !ccOpen) ccPlace(dy > 0 ? ccDrag.base + dy : ccDrag.base);
        if (ccDrag.kind !== "grab" && ccOpen && dy < 0) ccPlace(ccDrag.base + dy);
      }
      function ccPointerUp(event) {
        if (!ccDrag) return;
        const dy = event.clientY - ccDrag.y;
        const dt = Date.now() - ccDrag.t;
        const flick = (dist) => dist >= CC_FLICK_DY && dt > 0 && dt <= CC_FLICK_MS;
        const drag = ccDrag;
        ccDrag = null;
        if (drag.kind === "grab") {
          if (!ccOpen) ccSnap(dy >= CC_OPEN_DY || flick(dy));
          return;
        }
        if (!ccOpen) return;
        const up = -dy;
        if (up >= CC_OPEN_DY || flick(up)) {
          ccSnap(false);
          return;
        }
        if (drag.kind === "out") {
          ccSnap(false);
          return;
        }
        ccAte = drag.moved;
        ccSnap(true);
      }
      function ccIgnore(event) {
        if (!ccAte) return false;
        ccAte = false;
        event.preventDefault();
        event.stopPropagation();
        return true;
      }
      document.getElementById("bar").addEventListener("pointerdown", (event) => ccPointerDown(event, "grab"));
      ccSheet.addEventListener("pointerdown", (event) => ccPointerDown(event, "panel"));
      ccScrim.addEventListener("pointerdown", (event) => ccPointerDown(event, "out"));
      window.addEventListener("pointermove", ccPointerMove);
      window.addEventListener("pointerup", ccPointerUp);
      ccSheet.querySelector('[data-tile="wifi"]').addEventListener("click", (event) => {
        if (ccIgnore(event)) return;
        const tile = event.currentTarget;
        staOn = tile.getAttribute("aria-pressed") !== "true";
        tile.setAttribute("aria-pressed", staOn ? "true" : "false");
        tile.querySelector("small").textContent = staOn ? "On" : "Off";
        paintLink(face, failures);
      });
      ccSheet.querySelector('[data-tile="bt"]').addEventListener("click", (event) => {
        if (ccIgnore(event)) return;
        const tile = event.currentTarget;
        const bt = document.getElementById("bt");
        const on = tile.getAttribute("aria-pressed") !== "true";
        tile.setAttribute("aria-pressed", on ? "true" : "false");
        tile.querySelector("small").textContent = on ? "On" : "Off";
        if (bt) {
          bt.dataset.state = on ? "adv" : "off";
          bt.title = on ? "Bluetooth advertising" : "Bluetooth off";
        }
      });
      ccSheet.querySelector('[data-tile="rot"]').addEventListener("click", (event) => {
        if (ccIgnore(event)) return;
        paintRot(rot.dataset.state !== "lock");
      });
      ccSheet.querySelectorAll('[data-tile="mic"], [data-tile="spk"]').forEach((tile) => {
        tile.addEventListener("click", (event) => {
          if (ccIgnore(event)) return;
          const muted = tile.getAttribute("aria-pressed") !== "true";
          tile.setAttribute("aria-pressed", muted ? "true" : "false");
          tile.querySelector("small").textContent = muted ? "Muted" : "On";
        });
      });
      if (new URLSearchParams(location.search).get("cc") === "1") ccSnap(true);
      document.getElementById("mic").addEventListener("click", () => {
        message.textContent = "Voice not in this PoC";
      });
      const settingsScreen = document.getElementById("settings-screen");
      const settingsStatus = document.getElementById("settings-status");
      const settingsSelected = document.getElementById("settings-selected");
      const ssidRow = document.getElementById("ssid-row");
      function openSettings() {
        ccSnap(false);
        settingsScreen.hidden = false;
      }
      function closeSettings() {
        settingsScreen.hidden = true;
      }
      document.getElementById("settings").addEventListener("click", openSettings);
      document.getElementById("settings-done").addEventListener("click", closeSettings);
      document.getElementById("settings-manual").addEventListener("click", () => {
        ssidRow.hidden = false;
        document.getElementById("settings-ssid").focus();
      });
      document.getElementById("settings-scan").addEventListener("click", () => {
        settingsStatus.textContent = "Scanning...";
        window.setTimeout(() => {
          if (!settingsScreen.hidden) settingsStatus.textContent = "3 networks";
        }, 600);
      });
      document.querySelectorAll("#settings-screen .nets button").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#settings-screen .nets button").forEach((row) => {
            row.classList.toggle("on", row === btn);
          });
          const name = btn.textContent.trim().split(/\s+/)[0];
          settingsSelected.textContent = "Selected: " + name;
        });
      });
      if (new URLSearchParams(location.search).get("settings") === "1") openSettings();
      {
        const btState = new URLSearchParams(location.search).get("bt");
        const bt = document.getElementById("bt");
        const btTitle = { off: "Bluetooth off", adv: "Bluetooth advertising", conn: "Bluetooth connected" };
        if (bt && Object.prototype.hasOwnProperty.call(btTitle, btState)) {
          bt.dataset.state = btState;
          bt.title = btTitle[btState];
          if (btState === "off") {
            const tile = ccSheet.querySelector('[data-tile="bt"]');
            tile.setAttribute("aria-pressed", "false");
            tile.querySelector("small").textContent = "Off";
          }
        }
      }
      title.addEventListener("click", (event) => {
        event.stopPropagation();
        if (!title.classList.contains("badge")) return;
        fetch(base + "/api/unread/dismiss", { method: "POST" }).then(() => tick());
      });
      const sheet = document.getElementById("sheet");
      const sheetCopy = sheet.querySelector(".copy");
      let sheetDrag = null;
      let sheetLeaving = false;
      let sheetHold = false;

      const sheetNew = document.getElementById("sheet-new");
      const sheetAll = document.getElementById("sheet-all");
      const peek1 = document.getElementById("peek1");
      const peek2 = document.getElementById("peek2");
      const sheetGlow = document.getElementById("sheet-glow");
      const sheetInnerNear = document.getElementById("sheet-inner-near");
      const sheetInnerFar = document.getElementById("sheet-inner-far");
      let latest = null;
      let sheetAt = 0;
      let sheetFocus = "";
      let sheetSeen = [];
      const sheetDropped = new Set();

      function hexAlpha(hex, alpha) {
        const n = parseInt(String(hex).slice(1), 16);
        if (!Number.isFinite(n)) return "rgba(163,155,136," + alpha + ")";
        return (
          "rgba(" +
          ((n >> 16) & 255) +
          "," +
          ((n >> 8) & 255) +
          "," +
          (n & 255) +
          "," +
          alpha +
          ")"
        );
      }

      function waitingAgents(status) {
        return ((status && status.agents) || []).filter(agentNeeds);
      }

      function stackAgents(status) {
        return waitingAgents(status).filter((agent) => !sheetDropped.has(agent.id));
      }

      function hidePeeks() {
        peek1.hidden = true;
        peek2.hidden = true;
        peek1.classList.remove("show");
        peek2.classList.remove("show");
        sheet.classList.remove("stack1", "stack2");
        sheetGlow.classList.remove("stack1", "stack2");
      }

      function paintSheet(status) {
        latest = status;
        const raw = waitingAgents(status);
        for (const id of [...sheetDropped]) {
          if (!raw.some((agent) => agent.id === id)) sheetDropped.delete(id);
        }
        const show = label(status) === "NEEDS YOU" && !sheetHold && !sheetLeaving;
        const waiters = stackAgents(status);
        if (!show || waiters.length < 1) {
          if (!sheetLeaving) {
            sheet.classList.remove("up");
            sheetGlow.classList.remove("up");
            hidePeeks();
            sheetSeen = [];
            sheetFocus = "";
            sheetAt = 0;
          }
          return;
        }
        const fresh = waiters.some((agent) => sheetSeen.indexOf(agent.id) < 0);
        if (fresh || !sheetFocus) {
          sheetAt = 0;
        } else {
          const found = waiters.findIndex((agent) => agent.id === sheetFocus);
          sheetAt = found >= 0 ? found : 0;
        }
        const agent = waiters[sheetAt];
        const behind = waiters.length - sheetAt - 1;
        const steps = Math.min(2, Math.max(0, behind));
        const color = markColor(agent && agent.color);
        const mark = sheet.querySelector(".mark");
        sheetFocus = agent.id;
        sheetSeen = waiters.map((item) => item.id);
        sheet.style.borderColor = color;
        sheetGlow.querySelector(".far").style.borderColor = hexAlpha(color, 12 / 255);
        sheetGlow.querySelector(".mid").style.borderColor = hexAlpha(color, 32 / 255);
        sheetGlow.querySelector(".near").style.borderColor = hexAlpha(color, 72 / 255);
        sheetInnerNear.style.borderColor = hexAlpha(color, 36 / 255);
        sheetInnerFar.style.borderColor = hexAlpha(color, 14 / 255);
        paintMark(mark, agent && agent.shape, color);
        sheet.querySelector("h2").textContent = agent.title || agent.id || "NEEDS YOU";
        if (sheetCopy.dataset.agent !== agent.id) {
          sheetCopy.scrollTop = 0;
          sheetCopy.dataset.agent = agent.id;
        }
        const aside = rowAside(agent, status);
        if (sheetCopy.textContent !== aside) sheetCopy.textContent = aside;
        sheetNew.hidden = behind < 1;
        sheetNew.textContent = behind > 99 ? "99+ new" : behind + " new";
        sheetNew.style.borderColor = color;
        sheetAll.hidden = waiters.length < 2;
        sheet.classList.toggle("stack1", steps === 1);
        sheet.classList.toggle("stack2", steps >= 2);
        sheetGlow.classList.toggle("stack1", steps === 1);
        sheetGlow.classList.toggle("stack2", steps >= 2);
        peek1.hidden = steps < 1;
        peek2.hidden = steps < 2;
        peek1.classList.toggle("show", steps >= 1);
        peek2.classList.toggle("show", steps >= 2);
        if (steps >= 1) {
          peek1.style.top = steps >= 2 ? "62px" : "48px";
          peek1.style.borderColor = markColor(waiters[sheetAt + 1].color);
        }
        if (steps >= 2) {
          peek2.style.top = "48px";
          peek2.style.borderColor = markColor(waiters[sheetAt + 2].color);
        }
        sheet.classList.add("up");
        sheetGlow.classList.add("up");
      }

      function leaveSheet(body) {
        if (sheetLeaving || !sheet.classList.contains("up")) return;
        sheetLeaving = true;
        sheetHold = true;
        sheet.classList.remove("up");
        sheetGlow.classList.remove("up");
        hidePeeks();
        setTimeout(() => {
          sheetLeaving = false;
          fetch(base + "/api/dismiss", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: body || "{}",
          })
            .catch(() => {})
            .then(() => {
              sheetHold = false;
              return tick();
            });
        }, 280);
      }

      async function dismissCurrent() {
        const waiters = stackAgents(latest);
        const agent = waiters[sheetAt];
        if (!agent) {
          leaveSheet("{}");
          return;
        }
        if (waiters.length < 2) {
          leaveSheet(JSON.stringify({ agent_id: agent.id }));
          return;
        }
        sheetDropped.add(agent.id);
        const next = waiters.filter((item) => item.id !== agent.id);
        if (sheetAt >= next.length) sheetAt = next.length - 1;
        sheetFocus = next[sheetAt].id;
        paintSheet(latest);
        try {
          await fetch(base + "/api/dismiss", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ agent_id: agent.id }),
          });
        } catch (err) {
          /* The next status is the truth. */
        }
        await tick();
        const still = waitingAgents(latest).some((item) => item.id === agent.id);
        if (still) sheetDropped.delete(agent.id);
        paintSheet(latest);
      }

      function stepSheet(dir) {
        const waiters = stackAgents(latest);
        const at = sheetAt + dir;
        if (at < 0 || at >= waiters.length) return;
        sheetAt = at;
        sheetFocus = waiters[at].id;
        paintSheet(latest);
      }

      function sheetOverflow() {
        return sheetCopy.scrollHeight > sheetCopy.clientHeight + 1;
      }

      sheet.addEventListener("pointerdown", (event) => {
        if (!sheet.classList.contains("up") || event.button !== 0) return;
        sheetDrag = {
          id: event.pointerId,
          x: event.clientX,
          y: event.clientY,
          t: performance.now(),
        };
      });
      sheet.addEventListener("pointerup", (event) => {
        if (!sheetDrag || sheetDrag.id !== event.pointerId) return;
        const dx = event.clientX - sheetDrag.x;
        const dy = event.clientY - sheetDrag.y;
        const dt = performance.now() - sheetDrag.t;
        const ax = Math.abs(dx);
        const ay = Math.abs(dy);
        const dragged = ax > 8 || ay > 8;
        const flick = dy >= 48 && dt < 280;
        const dismiss = dy >= 40 && (!sheetOverflow() || flick);
        sheetDrag = null;
        if (ax >= 48 && ax > ay) stepSheet(dx < 0 ? 1 : -1);
        else if (dismiss || !dragged) dismissCurrent();
      });
      sheet.addEventListener("pointercancel", () => {
        sheetDrag = null;
      });
      sheetAll.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });
      sheetAll.addEventListener("click", (event) => {
        event.stopPropagation();
        leaveSheet("{}");
      });
      (function loop() {
        tick().then(() => setTimeout(loop, pollMs));
      })();
    </script>
  </body>
</html>
