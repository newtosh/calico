<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Desk panel preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #efe7d6;
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      #panel {
        position: relative;
        width: 480px;
        height: 480px;
        box-sizing: border-box;
        padding: 0;
        border-radius: 48px;
        overflow: hidden;
        background: #14160f;
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }
      #bar {
        width: 100%;
        height: 48px;
        box-sizing: border-box;
        padding: 16px 16px 0;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
        background: #0c0e09;
      }
      #lamp {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #e2a23a;
        flex: none;
      }
      #lamp.green {
        background: #9bb57a;
      }
      #lamp.red {
        background: #c4544a;
      }
      #brand,
      #toast {
        position: absolute;
        left: 50%;
        top: 0;
        width: 168px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 16px;
        line-height: 32px;
        color: #efe7d6;
        text-align: center;
        pointer-events: none;
        transform: translateX(-50%);
      }
      #toast {
        opacity: 0;
      }
      #toast.show {
        animation: toast 3.2s ease forwards;
      }
      #bar:has(#toast.show) #brand {
        visibility: hidden;
      }
      @keyframes toast {
        0% {
          opacity: 0;
          transform: translate(-50%, -10px);
        }
        8% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        82% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -6px);
        }
      }
      #glance {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      #wifi {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 14px;
      }
      #wifi i {
        width: 4px;
        display: block;
        background: #a39b88;
        opacity: 0.35;
      }
      #wifi i:nth-child(1) {
        height: 6px;
      }
      #wifi i:nth-child(2) {
        height: 10px;
      }
      #wifi i:nth-child(3) {
        height: 14px;
      }
      #wifi[data-bars="1"] i:nth-child(1),
      #wifi[data-bars="2"] i:nth-child(-n + 2),
      #wifi[data-bars="3"] i {
        background: #efe7d6;
        opacity: 1;
      }
      #bt {
        color: #a39b88;
        opacity: 0.45;
        font-size: 14px;
        line-height: 1;
        text-decoration: line-through;
      }
      #rotlock {
        height: 28px;
        min-width: 64px;
        font-size: 16px;
        padding: 0 8px;
      }
      #rotlock[aria-pressed="true"] {
        border-color: #9bb57a;
        background: #3d4f32;
      }
      #face {
        flex: 1;
        min-height: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #title,
      #message {
        width: 100%;
        text-align: center;
      }
      #title {
        margin: 4px 0 0;
        min-height: 24px;
        font-size: 24px;
        line-height: 1;
      }
      #title:empty {
        visibility: hidden;
      }
      #message {
        margin: 4px 0 0;
        font-size: 20px;
        line-height: 1;
        color: #a39b88;
      }
      #message:empty {
        display: none;
      }
      #agents {
        flex: 1;
        min-height: 0;
        width: 100%;
        margin: 2px 0 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        font-size: 24px;
        line-height: 1;
        user-select: none;
      }
      .agent {
        display: flex;
        align-items: center;
        gap: 12px;
        box-sizing: border-box;
        min-width: 0;
        min-height: 30px;
        padding: 0 8px;
        border-radius: 8px;
      }
      .agent.hot {
        background: #527044;
        box-shadow: inset 2px 0 0 #9bb57a;
      }
      .agent.hot .aside {
        color: #d4ccba;
      }
      .agent .name {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: clip;
      }
      .agent .aside {
        flex: 1 1 auto;
        width: auto;
        max-width: none;
        min-width: 48px;
        height: 24px;
        overflow: hidden;
        font-size: 20px;
        line-height: 24px;
        text-align: left;
        color: #a39b88;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .agent .aside.marquee {
        text-align: left;
        text-overflow: clip;
      }
      .agent .aside .track {
        display: inline-block;
        height: 24px;
        overflow: visible;
        text-overflow: clip;
        white-space: nowrap;
      }
      @keyframes aside-marquee {
        0%,
        12% {
          transform: translateX(0);
        }
        88%,
        100% {
          transform: translateX(var(--shift));
        }
      }
      .mark {
        width: 24px;
        height: 24px;
        flex: none;
        background: #a39b88;
      }
      .mark.circle {
        border-radius: 50%;
      }
      .mark.square {
        border-radius: 2px;
      }
      .mark.diamond {
        width: 18px;
        height: 18px;
        border-radius: 2px;
        transform: rotate(45deg);
      }
      .mark.triangle {
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
      }
      .mark.rounded {
        border-radius: 6px;
      }
      .mark.pill {
        clip-path: inset(1px 5px 1px 5px round 7px);
      }
      .mark.cloud {
        clip-path: url(#mark-cloud);
      }
      .mark.flower {
        clip-path: url(#mark-flower);
      }
      .mark.heart {
        clip-path: url(#mark-heart);
      }
      .mark.drop {
        clip-path: url(#mark-drop);
      }
      .mark.star {
        clip-path: url(#mark-star);
      }
      .mark.blob {
        clip-path: url(#mark-blob);
      }
      .mark.pentagon {
        clip-path: url(#mark-pentagon);
      }
      .mark.sun {
        clip-path: url(#mark-sun);
      }
      .mark.hex {
        clip-path: url(#mark-hex);
      }
      .agent span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #chrome {
        width: 100%;
        box-sizing: border-box;
        padding: 16px 24px 24px;
        background: #0c0e09;
      }
      #dock {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #count {
        margin: 0;
        font-size: 28px;
        line-height: 1;
        color: #9bb57a;
      }
      #mic,
      #settings {
        width: 72px;
        height: 58px;
        flex: none;
        padding: 0;
        display: grid;
        place-items: center;
        color: #efe7d6;
      }
      #mic svg,
      #settings svg {
        width: 40px;
        height: 40px;
      }
      #mic {
        background: #24261f;
        border-color: rgba(109, 103, 86, 0.4);
        color: rgba(239, 231, 214, 0.5);
      }
      #count.idle {
        color: #a39b88;
      }
      #newjump {
        position: absolute;
        top: 86px;
        left: 50%;
        z-index: 3;
        height: 32px;
        padding: 0 14px;
        transform: translateX(-50%);
        border: 1px solid #9bb57a;
        border-radius: 999px;
        background: #527044;
        color: #efe7d6;
        font-size: 16px;
      }
      #sleeper {
        display: none;
        align-items: flex-end;
        gap: 10px;
        margin-top: 36px;
        color: #a39b88;
        pointer-events: none;
      }
      #panel.asleep #sleeper {
        display: flex;
      }
      #sleeper .face {
        width: 96px;
        height: 96px;
        box-sizing: border-box;
        border: 3px solid #a39b88;
        border-radius: 50%;
        background: #a39b8833;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        animation: bob 4.4s ease-in-out infinite;
      }
      #sleeper .face i {
        width: 22px;
        height: 4px;
        border-radius: 2px;
        background: #a39b88;
      }
      #sleeper b {
        font-size: 24px;
        font-weight: 500;
        animation: zzz 4.2s linear infinite;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(10px);
        }
      }
      @keyframes zzz {
        0% {
          opacity: 0;
          transform: translateY(4px);
        }
        20% {
          opacity: 0.9;
          transform: translateY(4px);
        }
        80% {
          opacity: 0.9;
          transform: translateY(-12px);
        }
        100% {
          opacity: 0;
          transform: translateY(-12px);
        }
      }
      button {
        background: #2a2d24;
        color: #efe7d6;
        border: 1px solid #6d6756;
        border-radius: 6px;
        padding: 8px 14px;
        font: inherit;
      }
      #sheet {
        position: absolute;
        left: 0;
        right: 0;
        top: 48px;
        bottom: -36px;
        z-index: 4;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 28px 24px 72px;
        border-radius: 36px 36px 0 0;
        transform: translateY(110%);
        transition: transform 280ms ease-out;
        pointer-events: none;
      }
      #sheet.up {
        transform: translateY(0);
        pointer-events: auto;
      }
      #sheet .plate {
        width: 168px;
        height: 168px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      #sheet .mark {
        width: 120px;
        height: 120px;
      }
      #sheet .mark.square {
        border-radius: 10px;
      }
      #sheet .mark.rounded {
        border-radius: 30px;
      }
      #sheet .mark.diamond {
        width: 90px;
        height: 90px;
      }
      #sheet h2 {
        margin: 0;
        width: 100%;
        font-size: 24px;
        font-weight: 400;
        line-height: 1.2;
        text-align: center;
      }
      #sheet .copy {
        flex: 1;
        min-height: 0;
        width: 100%;
        overflow: auto;
        font-size: 20px;
        line-height: 1.25;
        text-align: center;
      }
      #title.badge {
        align-self: center;
        width: fit-content;
        min-height: 24px;
        margin: 4px auto 0;
        padding: 0 10px;
        border: 1px solid #e2a23a;
        border-radius: 999px;
        background: #2a2d24;
        color: #e2a23a;
        font-size: 16px;
        line-height: 22px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true">
      <defs>

          <circle cx="0.6458" cy="0.6458" r="0.3125" />

          <circle cx="0.2917" cy="0.375" r="0.25" />

        </clipPath>

          <circle cx="0.5" cy="0.6667" r="0.3333" />
          <polygon points="0.5,0.0417 0.1667,0.5833 0.8333,0.5833" />
        </clipPath>
        <clipPath id="mark-star" clipPathUnits="objectBoundingBox">
          <polygon points="0.5000,0.0000 0.5833,0.3750 0.9167,0.5000 0.5833,0.5833 0.5000,0.9167 0.3750,0.5833 0.0000,0.5000 0.3750,0.3750" />
        </clipPath>
        <clipPath id="mark-blob" clipPathUnits="objectBoundingBox">
          <polygon points="0.5000,0.0000 0.6667,0.1667 0.8333,0.2500 0.7500,0.5000 0.8750,0.7083 0.6667,0.7500 0.5000,0.7500 0.2917,0.8333 0.2083,0.6250 0.0000,0.5000 0.1667,0.2917 0.3333,0.2083" />
        </clipPath>
        <clipPath id="mark-pentagon" clipPathUnits="objectBoundingBox">
          <polygon points="0.5000,0.0000 0.9167,0.3333 0.7500,0.8333 0.2083,0.8333 0.0417,0.3333" />
        </clipPath>
        <clipPath id="mark-sun" clipPathUnits="objectBoundingBox">
          <polygon points="0.5000,0.0000 0.5833,0.2083 0.7917,0.1667 0.7500,0.3750 0.9167,0.5000 0.7500,0.5833 0.7917,0.7917 0.5833,0.7500 0.5000,0.9167 0.3750,0.7500 0.1667,0.7917 0.2083,0.5833 0.0000,0.5000 0.2083,0.3750 0.1667,0.1667 0.3750,0.2083" />
        </clipPath>
        <clipPath id="mark-hex" clipPathUnits="objectBoundingBox">
          <polygon points="0.5000,0.0000 0.8750,0.2500 0.8750,0.7083 0.5000,0.9167 0.0833,0.7083 0.0833,0.2500" />
        </clipPath>
      </defs>
    </svg>
    <div id="panel" class="asleep">
      <div id="bar">
        <i id="lamp" class="amber"></i>
        <div id="brand">grokbot-buddy</div>
        <div id="toast"></div>
        <div id="glance">
          <span id="wifi" data-bars="0" title="Wi-Fi"><i></i><i></i><i></i></span>
          <span id="bt" title="Bluetooth off">BT</span>
          <button id="rotlock" type="button" aria-pressed="false">Auto</button>
        </div>
      </div>
      <div id="face">
      <p id="title"></p>
      <p id="message"></p>
      <div id="sleeper" aria-hidden="true">
        <div class="face"><i></i><i></i></div>
        <b>Zzz</b>
      </div>
      <div id="agents"></div>
      <button id="newjump" type="button" hidden>1 new</button>
      </div>
      <div id="sheet">
        <div class="plate"><i class="mark circle"></i></div>
        <h2></h2>
        <div class="copy"></div>
      </div>
      <div id="chrome">
        <div id="dock">
          <button id="mic" type="button" aria-label="Mic">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
              <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
              <line x1="12" x2="12" y1="19" y2="22" />
            </svg>
          </button>
          <p id="count" class="idle">idle</p>
          <button id="settings" type="button" aria-label="Settings">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    <script>
      const base = new URLSearchParams(location.search).get("base") || "http://127.0.0.1:8787";
      const panel = document.getElementById("panel");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const count = document.getElementById("count");
      const agents = document.getElementById("agents");
      const lamp = document.getElementById("lamp");
      const toast = document.getElementById("toast");
      const wifi = document.getElementById("wifi");
      const rotlock = document.getElementById("rotlock");
      const neutral = "#a39b88";
      let failures = 0;
      let statusSeen = "IDLE";
      let face = "IDLE";
      let drag = null;
      let marquee = { id: "", text: "", until: 0, ready: false };

      agents.addEventListener("pointerdown", (event) => {
        if (event.pointerType !== "mouse" || event.button !== 0) return;
        drag = { id: event.pointerId, y: event.clientY, top: agents.scrollTop };
        agents.setPointerCapture(event.pointerId);
      });
      agents.addEventListener("pointermove", (event) => {
        if (!drag || drag.id !== event.pointerId) return;
        agents.scrollTop = drag.top - (event.clientY - drag.y);
      });
      function endDrag(event) {
        if (!drag || drag.id !== event.pointerId) return;
        drag = null;
      }
      agents.addEventListener("pointerup", endDrag);
      agents.addEventListener("pointercancel", endDrag);

      const newjump = document.getElementById("newjump");
      let prevStatus = null;
      let unseen = 0;
      let settling = false;

      function countUpdates(prev, next) {
        const prevList = (prev && prev.agents) || [];
        const nextList = (next && next.agents) || [];
        let n = 0;
        nextList.forEach((agent) => {
          const key = agent.id || agent.title || "";
          const old = key ? prevList.find((row) => (row.id || row.title || "") === key) : null;
          if (!old) {
            n += 1;
            return;
          }
          if (
            (agent.status || "") !== (old.status || "") ||
            !!agent.attention !== !!old.attention ||
            rowAside(agent, next) !== rowAside(old, prev)
          ) {
            n += 1;
          }
        });
        return n;
      }

      function paintNew() {
        const away =
          agents.scrollTop > 0 &&
          !panel.classList.contains("asleep") &&
          !document.getElementById("sheet").classList.contains("up");
        newjump.hidden = !away || unseen < 1;
        if (newjump.hidden) return;
        newjump.textContent = unseen > 99 ? "99+ new" : unseen + " new";
        newjump.style.top = message.textContent ? "98px" : "86px";
      }

      agents.addEventListener("scroll", () => {
        if (settling) return;
        if (agents.scrollTop <= 0) unseen = 0;
        paintNew();
      });
      newjump.addEventListener("click", (event) => {
        event.stopPropagation();
        unseen = 0;
        agents.scrollTop = 0;
        paintNew();
      });

      function statusText(phaseLabel, fail) {
        if (phaseLabel === "NO NETWORK" || phaseLabel === "SCAN FAILED") return phaseLabel;
        if (fail >= 3 || phaseLabel === "link down") return "link down";
        if (fail > 0) return "reconnecting";
        return phaseLabel || "IDLE";
      }

      function showToast(text) {
        if (!text || text === statusSeen) return;
        statusSeen = text;
        toast.textContent = text;
        toast.classList.remove("show");
        void toast.offsetWidth;
        toast.classList.add("show");
      }

      toast.addEventListener("animationend", () => toast.classList.remove("show"));

      function paintLink(phaseLabel, fail) {
        const text = statusText(phaseLabel, fail);
        const down = text === "link down" || text === "NO NETWORK" || text === "SCAN FAILED";
        const degraded = !down && (fail > 0 || text === "reconnecting");
        lamp.className = down ? "red" : degraded ? "amber" : "green";
        wifi.dataset.bars = down ? "0" : degraded ? "1" : "3";
        showToast(text);
      }

      function markColor(value) {
        const match = /^#?([0-9a-fA-F]{6})$/.exec(String(value || "").trim());
        return match ? "#" + match[1] : neutral;
      }

      const markShapes = {
        square: "square",
        diamond: "diamond",
        triangle: "triangle",
        cloud: "cloud",
        rounded: "rounded",
        rounded_square: "rounded",
        star: "star",
        flower: "flower",
        clover: "flower",
        heart: "heart",
        blob: "blob",
        splatter: "blob",
        drop: "drop",
        teardrop: "drop",
        pill: "pill",
        capsule: "pill",
        pentagon: "pentagon",
        shield: "pentagon",
        sun: "sun",
        gear: "sun",
        hex: "hex",
        hexagon: "hex",
      };

      function markShape(value) {
        const key = String(value || "").trim().toLowerCase();
        return markShapes[key] || "circle";
      }

      function unreadText(status) {
        const count = Number(status && status.unread);
        if (!Number.isFinite(count) || count < 1) return "";
        return count > 99 ? "99+ unread" : Math.floor(count) + " unread";
      }

      function faceTitle(event) {
        if (!event || !event.title || (event.title === "Dismissed" && !event.message)) return "";
        return event.title;
      }

      function agentNeeds(agent) {
        return !!(agent && (agent.attention === true || agent.status === "needs_you"));
      }

      function rowAside(agent, status) {
        if (agent && agent.message) return agent.message;
        const note = (status.last_event && status.last_event.message) || "";
        const title = faceTitle(status.last_event);
        const eventAgent = (status.last_event && status.last_event.agent_id) || "";
        if (!note) return "";
        if (eventAgent && agent.id === eventAgent) return note;
        if (title && (agent.title === title || agent.id === title)) return note;
        if (!title && agentNeeds(agent)) return note;
        const list = status.agents || [];
        const waiters = list.filter(agentNeeds);
        const titled = title && list.some((row) => row.title === title || row.id === title);
        return agentNeeds(agent) && waiters.length === 1 && !titled ? note : "";
      }

      function syncMarquee(agent, aside, hot) {
        const id = agent ? agent.id || "" : "";
        const text = aside || "";
        if (!marquee.ready) {
          marquee = { id, text, until: hot && text ? Date.now() + 20000 : 0, ready: true };
          return;
        }
        const same = marquee.id === id && marquee.text === text;
        if (marquee.until > Date.now() && same) return;
        marquee = {
          id,
          text,
          until: hot && text && !same ? Date.now() + 20000 : 0,
          ready: true,
        };
      }

      function asideNode(text, scroll) {
        const aside = document.createElement("span");
        aside.className = "aside" + (scroll ? " marquee" : "");
        if (!scroll) {
          aside.textContent = text;
          return aside;
        }
        const track = document.createElement("span");
        const started = marquee.until - 20000;
        track.className = "track";
        track.textContent = text;
        aside.append(track);
        requestAnimationFrame(() => {
          const shift = Math.min(0, aside.clientWidth - track.scrollWidth);
          track.style.setProperty("--shift", shift + "px");
          track.style.animation = "aside-marquee 8s linear infinite";
          track.style.animationDelay = "-" + Math.max(0, Date.now() - started) + "ms";
        });
        return aside;
      }

      function label(status) {
        if (failures >= 3) return "link down";
        const waiting = (status.agents || []).some(agentNeeds);
        if (status.needs_you || status.phase === "needs_you" || waiting) return "NEEDS YOU";
        if (status.phase === "running") return "RUNNING";
        return "IDLE";
      }

      let pollMs = 2000;

      async function tick() {
        try {
          const response = await fetch(base + "/api/status");
          if (!response.ok) throw new Error(String(response.status));
          const status = await response.json();
          failures = 0;
          face = label(status);
          paintLink(face, failures);
          const badge = unreadText(status);
          title.textContent = badge;
          title.classList.toggle("badge", badge !== "");
          const note = (status.last_event && status.last_event.message) || "";
          const list = status.agents || [];
          const running = list.filter((agent) => agent.status === "running").length;
          const quiet = label(status) === "IDLE" && running === 0;
          pollMs = quiet ? 10000 : 2000;
          count.textContent = running === 0 ? "idle" : running + "/" + list.length + " running";
          count.classList.toggle("idle", running === 0);
          panel.classList.toggle("asleep", quiet && list.length === 0);
          const top = list[0];
          const topAside = top ? rowAside(top, status) : "";
          const keep = agents.scrollTop;
          const added = keep > 0 && prevStatus ? countUpdates(prevStatus, status) : 0;
          syncMarquee(top, topAside, !!(top && (agentNeeds(top) || topAside)));
          settling = true;
          agents.replaceChildren();
          let placed = false;
          list.forEach((agent, index) => {
            const row = document.createElement("div");
            const mark = document.createElement("i");
            const name = document.createElement("span");
            const asideText = rowAside(agent, status);
            const scrolling =
              index === 0 && marquee.until > Date.now() && marquee.text === asideText;
            row.className = "agent" + (agentNeeds(agent) || asideText ? " hot" : "");
            mark.className = "mark " + markShape(agent.shape);
            mark.style.background = markColor(agent.color);
            name.className = "name";
            name.textContent = agent.title || agent.id || "agent";
            row.append(mark, name);
            if (asideText) {
              row.append(asideNode(asideText, scrolling));
              placed = true;
            }
            agents.append(row);
          });
          message.textContent = placed ? "" : note;
          agents.scrollTop = keep;
          settling = false;
          unseen = agents.scrollTop > 0 ? unseen + added : 0;
          prevStatus = status;
          paintSheet(status);
          paintNew();
        } catch (err) {
          failures = Math.min(3, failures + 1);
          pollMs = 2000;
          if (failures >= 3) face = "link down";
          paintLink(face, failures);
          if (failures >= 3) {
            panel.classList.remove("asleep");
          }
        }
      }

      rotlock.addEventListener("click", (event) => {
        const locked = rotlock.getAttribute("aria-pressed") !== "true";
        event.stopPropagation();
        rotlock.setAttribute("aria-pressed", locked ? "true" : "false");
        rotlock.textContent = locked ? "Lock" : "Auto";
      });
      document.getElementById("mic").addEventListener("click", () => {
        message.textContent = "Voice not in this PoC";
      });
      title.addEventListener("click", (event) => {
        event.stopPropagation();
        if (!title.classList.contains("badge")) return;
        fetch(base + "/api/unread/dismiss", { method: "POST" }).then(() => tick());
      });
      const sheet = document.getElementById("sheet");
      const sheetCopy = sheet.querySelector(".copy");
      let sheetDrag = null;
      let sheetLeaving = false;
      let sheetHold = false;

      function sheetInk(hex) {
        const n = parseInt(String(hex).slice(1), 16);
        const y = (299 * ((n >> 16) & 255) + 587 * ((n >> 8) & 255) + 114 * (n & 255)) / 1000;
        return y < 140 ? "#efe7d6" : "#14160f";
      }

      function featuredAgent(status) {
        const list = (status && status.agents) || [];
        if (agentNeeds(list[0])) return list[0];
        return list.find(agentNeeds) || null;
      }

      function paintSheet(status) {
        const show = label(status) === "NEEDS YOU" && !sheetHold && !sheetLeaving;
        if (!show) {
          if (!sheetLeaving) sheet.classList.remove("up");
          return;
        }
        const agent = featuredAgent(status);
        const color = markColor(agent && agent.color);
        const ink = sheetInk(color);
        const mark = sheet.querySelector(".mark");
        sheet.style.background = color;
        sheet.style.color = ink;
        sheet.querySelector(".plate").style.background = ink;
        mark.className = "mark " + markShape(agent && agent.shape);
        mark.style.background = color;
        sheet.querySelector("h2").textContent =
          (agent && (agent.title || agent.id)) || "NEEDS YOU";
        sheetCopy.textContent = agent ? rowAside(agent, status) : "";
        sheet.classList.add("up");
      }

      function leaveSheet() {
        if (sheetLeaving || !sheet.classList.contains("up")) return;
        sheetLeaving = true;
        sheetHold = true;
        sheet.classList.remove("up");
        setTimeout(() => {
          sheetLeaving = false;
          fetch(base + "/api/dismiss", { method: "POST" })
            .catch(() => {})
            .then(() => {
              sheetHold = false;
              return tick();
            });
        }, 280);
      }

      function sheetOverflow() {
        return sheetCopy.scrollHeight > sheetCopy.clientHeight + 1;
      }

      sheet.addEventListener("pointerdown", (event) => {
        if (!sheet.classList.contains("up") || event.button !== 0) return;
        sheetDrag = { id: event.pointerId, y: event.clientY, t: performance.now() };
      });
      sheet.addEventListener("pointerup", (event) => {
        if (!sheetDrag || sheetDrag.id !== event.pointerId) return;
        const dy = event.clientY - sheetDrag.y;
        const dt = performance.now() - sheetDrag.t;
        const dragged = dy > 8 || dy < -8;
        const flick = dy >= 48 && dt < 280;
        const dismiss = dy >= 40 && (!sheetOverflow() || flick);
        sheetDrag = null;
        if (dismiss) leaveSheet();
        else if (!dragged) leaveSheet();
      });
      sheet.addEventListener("pointercancel", () => {
        sheetDrag = null;
      });
      (function loop() {
        tick().then(() => setTimeout(loop, pollMs));
      })();
    </script>
  </body>
</html>
